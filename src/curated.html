<!doctype html>
<html lang="__HTML_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chime · Curated Replay</title>
<style>
:root{color-scheme:dark;--bg:#090914;--panel:#111021;--card:#19162d;--line:#2b2643;--ink:#f3efff;--muted:#a19ab6;--violet:#8056ff;--lilac:#bca6ff;--good:#34d399;--warn:#fbbf24;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}body{height:100dvh;overflow:hidden}button,a,input{font:inherit}button,a{color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card)}button:hover{border-color:var(--lilac)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--lilac);outline-offset:3px}button:disabled{cursor:default;opacity:.35}a{text-decoration:none}small{font-size:11px}::-webkit-scrollbar{height:5px;width:5px}::-webkit-scrollbar-thumb{background:#514368;border-radius:10px}
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:12px;padding:16px 20px 12px;max-width:2400px;margin:auto;min-width:0}.top{display:flex;align-items:center;gap:16px;min-width:0}.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#c2b5ff,#6942e9);display:grid;place-items:center;font-size:20px;font-weight:800}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}.room{min-width:0;flex:1;border-left:1px solid var(--line);padding-left:16px}.room h1{font-size:16px;margin:0 0 4px;font-weight:650}.room p{margin:0;font-size:11px;color:var(--muted)}.edition{font-size:11px;border:1px solid #6a4ab0;background:#21193b;padding:6px 10px;border-radius:20px;white-space:nowrap}.language{font-size:12px;color:var(--lilac);padding:8px}.toolbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:10px 14px}.play{width:46px;height:46px;border-radius:50%;background:var(--violet);border:3px solid #b29dff;font-size:22px;flex-shrink:0;box-shadow:0 0 22px #8056ff25}.nav{width:30px;height:32px;border-radius:9px;font-size:17px}.time{min-width:174px;margin-left:4px}.time b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:550}.time span{font-size:11px;color:var(--muted)}.range{appearance:none;-webkit-appearance:none;flex:1;min-width:50px;height:4px;border:0;border-radius:6px;background:linear-gradient(to right,var(--violet) var(--progress,0%),#3b3150 var(--progress,0%));cursor:pointer}.range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--violet);border:2px solid var(--lilac)}.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--violet);border:2px solid var(--lilac)}.speed{display:flex;gap:2px;padding:3px;background:var(--bg);border-radius:18px}.speed button{padding:5px 9px;border:0;border-radius:15px;background:transparent;font-size:12px}.speed button[aria-pressed=true]{background:var(--violet)}.zone{font-size:11px;padding:7px 10px;border-radius:9px;white-space:nowrap}
.layout{display:grid;grid-template-columns:164px minmax(0,1fr) 380px;gap:12px;min-height:0;min-width:0}.people{min-height:0;overflow:auto;padding:8px 8px 10px 0}.section-label{color:var(--muted);font-size:11px;margin:4px 0 12px;font-weight:550;display:flex;justify-content:space-between}.member{display:flex;align-items:center;width:100%;gap:10px;margin-bottom:8px;padding:10px 9px;text-align:left;background:transparent;border:1px solid transparent;border-radius:13px}.member.active{background:#201939;border-color:#69528d}.avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--color);color:#10101c;font-weight:750;border:3px solid var(--bg);outline:1px solid var(--color);font-size:13px}.member b{font-size:12px;display:block}.member span:last-child{min-width:0}.member small{display:block;line-height:1.5;color:var(--muted);margin-top:3px}.role-note{color:#736b89;font-size:10px;line-height:1.6;padding:10px 8px;border-top:1px solid var(--line);margin-top:14px}.visual{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#05060f}.visual iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}.loading[hidden]{display:none}.detail{min-width:0;min-height:0;overflow:auto;padding:8px 2px 12px}.phase{display:inline-block;background:#28203e;color:var(--lilac);padding:5px 10px;border-radius:16px;font-size:11px}.phase.pause{background:#3a2a14;color:var(--warn)}.actor{display:flex;align-items:center;gap:10px;margin:17px 0}.actor .avatar{width:42px;height:42px}.actor b{font-size:14px}.actor small{display:block;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}.detail h2{font-size:23px;line-height:1.45;font-weight:650;letter-spacing:-.4px;margin:12px 0}.description{color:#cbc4dc;line-height:1.9;font-size:14px;margin:0 0 20px}.handoff{padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.handoff small{display:block;color:var(--muted);margin-bottom:8px}.handoff b{font-weight:600}.source{display:flex;gap:6px;color:var(--good);font-size:11px;margin:16px 0}.source span{color:var(--muted)}.outcome{padding:12px;border-left:2px solid var(--warn);background:#231d16;border-radius:0 12px 12px 0;font-size:12px;line-height:1.7;color:#d4c3a1}.outcome b{display:block;color:var(--warn);font-size:10px;margin-bottom:6px}.outcome p{margin:0}.steps{min-width:0;border-top:1px solid var(--line);padding-top:9px}.steps-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}.step-list{display:flex;gap:7px;overflow:auto;padding:2px 2px 7px;scrollbar-width:thin}.step{flex:1 0 154px;max-width:180px;text-align:left;border-radius:11px;padding:9px 10px;background:var(--panel);min-height:59px}.step i{font-style:normal;font-size:10px;color:var(--muted);display:block;margin-bottom:4px;font-variant-numeric:tabular-nums}.step b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.4;font-weight:550}.step.on{background:#291e46;border-color:#aa8cff}.step.past{border-color:#4b3b65}.step.on i{color:var(--lilac)}
.chapters{display:flex;gap:7px;min-width:0;overflow:auto;padding:0 1px 3px}.chapter{flex:1 0 auto;text-align:left;padding:10px 14px;border-radius:11px;background:transparent;font-size:12px;color:var(--muted)}.chapter small{margin-left:9px;color:#756a91;font-variant-numeric:tabular-nums}.chapter.on{color:var(--ink);background:#251b3e;border-color:#9674d2}.chapter.on small{color:var(--lilac)}.event-tags{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.scope-tag{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:14px}.scope-tag.case{color:#6ee7b7;border-color:#275346}.narrative{border-top:1px solid var(--line);margin-top:18px}.narrative section{padding-top:14px}.narrative h3{margin:0 0 6px;font-size:11px;font-weight:550;color:var(--lilac)}.narrative p{margin:0;font-size:13px;line-height:1.85;color:#cbc4dc}.conversation{margin:15px 0;padding:13px 14px;background:#1c172b;border-left:2px solid #7953b6;border-radius:0 10px 10px 0}.conversation small{color:var(--muted);display:block;font-size:10px}.conversation b{font-size:11px;display:block;margin:8px 0 5px;color:var(--lilac)}.conversation p{margin:0;line-height:1.85;font-size:13px;color:#e2d9f3}.description{margin-bottom:10px}.detail .handoff{margin-top:18px}
.speech-label{font-size:11px;color:var(--lilac);margin:8px 0 10px}.original-message{margin:0;padding:16px;background:#1b152c;border-left:3px solid #a889ef;border-radius:0 12px 12px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.9;color:#f3efff;user-select:text}.source-speaker{color:var(--muted);font-size:10px;overflow-wrap:anywhere;margin:0 0 14px}.redaction-note{font-size:10px;color:var(--muted);margin:9px 0}.reference-block{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}.reference-block>summary{cursor:pointer;color:var(--muted);font-size:12px}.reference-block>p{font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;color:#cac0db}.reference-block .narrative{border:0}.reference-block h2{font-size:16px}.original-message+.reference-block{margin-top:12px}
@media(min-width:1700px){.layout{grid-template-columns:190px minmax(0,1fr) 430px}.detail h2{font-size:26px}.description{font-size:15px}.app{gap:16px;padding:20px 28px}}
@media(max-width:1120px){.app{padding:12px;gap:9px}.layout{grid-template-columns:150px minmax(0,1fr) 265px;gap:9px}.member{gap:8px;padding:9px 4px}.member .avatar{width:32px;height:32px}.detail h2{font-size:20px}.description{font-size:13px}.time{min-width:150px}.time b{font-size:17px}.brand small{display:none}.room h1{font-size:14px}}
@media(max-width:850px){body{height:auto;min-height:100dvh;overflow:auto}.app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto auto auto}.layout{grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:auto minmax(470px,62vh)}.people{grid-column:1/-1;display:flex;gap:6px;overflow:auto;padding:4px}.people .section-label,.role-note{display:none}.member{min-width:160px;width:160px;margin:0}.visual{grid-column:1;grid-row:2}.detail{grid-column:2;grid-row:2}.top{gap:8px}.room{padding-left:10px}.room h1{font-size:13px}.edition{display:none}.toolbar{gap:6px;padding:9px}.time{min-width:130px}.time b{font-size:15px}.speed button{padding:5px 7px}}
@media(max-width:600px){.toolbar{flex-wrap:wrap}.range{order:5;flex-basis:100%;margin:8px 0}.time{flex:1}.layout{display:flex;flex-direction:column}.people{flex-shrink:0}.visual{height:480px;flex-shrink:0}.detail{overflow:visible}.detail h2{font-size:21px}.room p{display:none}.brand b{font-size:14px}.room h1{font-size:12px}.zone{padding:6px}.nav{display:none}.time{min-width:115px}.time b{font-size:14px}.play{width:38px;height:38px;font-size:18px}.language{font-size:11px;padding:4px}.step{flex-basis:118px}.outcome{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><span class="mark">C</span><div><b>Chime</b><small id="edition"></small></div></div><div class="room"><h1 id="title"></h1><p id="scope"></p></div><span class="edition" id="version"></span><a class="language" id="language"></a></header>
  <section class="toolbar" aria-label="Replay controls"><button class="nav" id="previous">‹</button><button class="play" id="play">▶</button><button class="nav" id="next">›</button><div class="time"><b id="clock"></b><span id="counter"></span></div><input class="range" id="range" type="range" min="0" value="0"><div class="speed" id="speed"><button data-speed="1" aria-pressed="true">1×</button><button data-speed="2" aria-pressed="false">2×</button><button data-speed="3" aria-pressed="false">3×</button></div><button class="zone" id="zone"></button></section>
  <nav class="chapters" id="chapters" aria-label="Business stages"></nav>
  <main class="layout"><aside class="people" id="people"></aside><section class="visual"><span class="loading" id="loading"></span><iframe id="scene" title="Chime 3D replay"></iframe></section><aside class="detail" id="detail"></aside></main>
  <section class="steps"><div class="steps-head"><span id="timeline-title"></span><span id="time-note"></span></div><nav class="step-list" id="steps" aria-label="Replay steps"></nav></section>
</div>
<script id="case-data" type="application/json">__CASE_DATA__</script>
<script id="scene-data" type="application/json">__SCENE_DATA__</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), D=JSON.parse($('#case-data').textContent), E=D.events, U=D.ui, P=Object.fromEntries(D.people.map(p=>[p.id,p]));
const hash=new URLSearchParams(location.hash.slice(1));
let index=Math.max(0,Math.min(E.length-1,Math.floor(Number(hash.get('i'))||1)-1)), timezone=hash.get('tz')==='utc'?'utc':'bj', speed=1, playing=false, timer=null, ready=false;
const frame=$('#scene');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=p=>p.name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=p=>`<span class="avatar" style="--color:${p.color}">${esc(initials(p))}</span>`;
const timeZone=()=>timezone==='bj'?'Asia/Shanghai':'UTC';
const dateText=(ts,seconds=false)=>new Intl.DateTimeFormat(D.lang==='zh'?'zh-CN':'en-GB',{timeZone:timeZone(),month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{}),hourCycle:'h23'}).format(new Date(ts));
$('#edition').textContent=U.edition;$('#title').textContent=D.meta.title;$('#scope').textContent=D.meta.scope;$('#version').textContent=U.version+' · '+D.meta.version;$('#timeline-title').textContent=U.timeline;$('#time-note').textContent=U.time_note;$('#loading').textContent=U.ready;$('#range').max=E.length-1;$('#range').setAttribute('aria-label',U.timeline);$('#previous').title=U.previous;$('#next').title=U.next;document.title='Chime · '+U.edition;
$('#people').innerHTML=`<div class="section-label">${esc(U.participants)}<span>${D.people.length}</span></div>`+D.people.map(p=>`<button class="member" data-person="${p.id}" title="${esc(p.role)}">${avatar(p)}<span><b>${esc(p.short)}</b><small>${esc(p.role)}</small></span></button>`).join('')+`<div class="role-note">${esc(U.roles)}</div>`;
$('#chapters').setAttribute('aria-label',U.chapters);
$('#chapters').innerHTML=D.chapters.map(c=>`<button class="chapter" data-chapter="${c.id}">${esc(c.name)}<small>${E.filter(e=>e.chapter===c.id).length}</small></button>`).join('');
$('#steps').innerHTML=E.map((e,i)=>`<button class="step" data-index="${i}" title="${esc(e.title)}"><i>${String(i+1).padStart(2,'0')}</i><b>${esc(e.action)}</b></button>`).join('');
function syncScene(change){
 if(!ready)return;const w=frame.contentWindow;
 if(w.REPLAY_TZ!==timeZone())w.setReplayTimezone(timeZone());
 w.setReplayPlayback(speed,playing);if(change)w.setReplayStep(index);
}
function paint(){
 const e=E[index],p=P[e.actor];
 $('#clock').textContent=dateText(e.ts,true);$('#counter').textContent=`${index+1} / ${E.length} ${U.step}`;$('#range').value=index;$('#range').style.setProperty('--progress',`${index/Math.max(1,E.length-1)*100}%`);$('#zone').textContent=timezone==='bj'?U.timezone:U.utc;$('#play').textContent=playing?'Ⅱ':'▶';$('#play').title=playing?U.pause:U.play;$('#play').setAttribute('aria-label',playing?U.pause:U.play);$('#previous').disabled=index===0;$('#next').disabled=index===E.length-1;
 document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===speed)));
 document.querySelectorAll('[data-person]').forEach(b=>b.classList.toggle('active',b.dataset.person===e.actor));
 document.querySelectorAll('[data-index]').forEach(b=>{b.classList.toggle('on',Number(b.dataset.index)===index);b.classList.toggle('past',Number(b.dataset.index)<index);b.setAttribute('aria-current',Number(b.dataset.index)===index?'step':'false');});
 document.querySelectorAll('[data-chapter]').forEach(b=>{b.classList.toggle('on',b.dataset.chapter===e.chapter);b.setAttribute('aria-current',b.dataset.chapter===e.chapter?'step':'false');});
 const source=D.sources.find(s=>s.id===e.src)?.name||U.reporting;
 const speech=e.original;
 const narrative=e.context?`<div class="narrative"><section><h3>${esc(U.context)}</h3><p>${esc(e.context)}</p></section><section><h3>${esc(U.decision)}</h3><p>${esc(e.decision)}</p></section>${!speech?`<div class="conversation"><small>${esc(U.excerpt)}</small><b>${esc(P[e.excerpt_speaker].short)}</b><p>${esc(e.excerpt)}</p></div>`:''}<section><h3>${esc(U.result)}</h3><p>${esc(e.result)}</p></section></div>`:'';
 const content=speech?`<p class="speech-label">${esc(U.original)} · ${esc(source)}</p><div class="source-speaker">${esc(speech.speaker_label)}</div><blockquote class="original-message" lang="${speech.language}">${esc(speech.text)}</blockquote>${speech.redacted?`<p class="redaction-note">${esc(U.links_hidden)}</p>`:''}${speech.language!==D.lang?`<details class="reference-block"><summary>${esc(U.translation)}</summary><p>${esc(speech.translation)}</p></details>`:''}<details class="reference-block editorial-notes"><summary>${esc(U.commentary)}</summary><h2>${esc(e.title)}</h2><p>${esc(e.text)}</p>${narrative}</details>`:`<h2>${esc(e.title)}</h2><p class="description">${esc(e.text)}</p>${narrative}`;
 $('#detail').innerHTML=`<div class="section-label">${esc(e.chapter_name||U.event)}<span>${index+1} / ${E.length}</span></div><div class="event-tags"><span class="phase ${e.phase}">${esc(e.phase_name)}</span><span class="scope-tag ${e.scope_level}" title="${esc(U.scope_note)}">${esc(e.scope_name)}</span></div><div class="actor">${avatar(p)}<div><b>${esc(p.name)}</b><small>${esc(dateText(e.ts,true))} · ${esc(timezone==='bj'?U.timezone:U.utc)}</small></div></div>${content}${e.to.length?`<div class="handoff"><small>${esc(U.handoff)}</small><b>${esc(p.short)} → ${e.to.map(id=>esc(P[id].short)).join(' · ')}</b></div>`:''}<div class="source">✓ ${esc(U.checked)} <span>· ${esc(source)}</span></div>${index>=E.length-2?`<div class="outcome"><b>${esc(U.outcome)}</b><p>${esc(D.meta.outcome)}</p></div>`:''}`;
 const target=D.lang==='zh'?'en':'zh';$('#language').textContent=U.language;$('#language').href=`/showcase/chime/${target}#i=${index+1}&tz=${timezone}`;
 history.replaceState(null,'',`#i=${index+1}&tz=${timezone}`);
}
function go(i){index=Math.max(0,Math.min(E.length-1,Math.floor(Number(i)||0)));paint();$('#detail').scrollTop=0;const selected=$('#steps .on'),list=$('#steps');if(selected&&(selected.offsetLeft<list.scrollLeft||selected.offsetLeft+selected.offsetWidth>list.scrollLeft+list.clientWidth))list.scrollLeft=selected.offsetLeft-list.clientWidth/2+selected.offsetWidth/2;syncScene(true);}
function pause(){playing=false;clearTimeout(timer);timer=null;paint();syncScene(false);}
function readingTime(event){if(!event.original)return 1900;const text=event.original.text;const units=event.original.language==='zh'?Array.from(text).length/2:text.split(/\s+/).length;return Math.max(3500,Math.min(24000,1500+units*240));}
function advance(){timer=setTimeout(()=>{if(!playing)return;go(index+1);if(index===E.length-1)pause();else advance();},readingTime(E[index])/speed);}
function play(){if(playing)return;if(index===E.length-1)go(0);playing=true;paint();syncScene(false);advance();}
$('#play').onclick=()=>playing?pause():play();$('#previous').onclick=()=>{pause();go(index-1);};$('#next').onclick=()=>{pause();go(index+1);};$('#range').oninput=e=>{pause();go(e.target.value);};$('#zone').onclick=()=>{timezone=timezone==='bj'?'utc':'bj';paint();syncScene(false);};
$('#speed').onclick=e=>{const b=e.target.closest('[data-speed]');if(!b)return;const resume=playing;pause();speed=Number(b.dataset.speed);paint();if(resume)play();else syncScene(false);};
$('#chapters').onclick=e=>{const b=e.target.closest('[data-chapter]');if(b){pause();go(E.findIndex(x=>x.chapter===b.dataset.chapter));}};
$('#steps').onclick=e=>{const b=e.target.closest('[data-index]');if(b){pause();go(b.dataset.index);}};
$('#people').onclick=e=>{const b=e.target.closest('[data-person]');if(b){const actor=E.findIndex(x=>x.actor===b.dataset.person),i=actor>=0?actor:E.findIndex(x=>x.to.includes(b.dataset.person));if(i>=0){pause();go(i);}}};
window.__replay3DGo=i=>{pause();go(i);};window.__replay3DFocus=id=>{document.querySelectorAll('[data-person]').forEach(b=>b.classList.toggle('active',b.dataset.person===id));};
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.source!=='campaign-replay-3d'||e.data?.type!=='ready')return;ready=true;$('#loading').hidden=true;syncScene(true);frame.contentWindow.FeedViews.scene3d.setPreset('people',{instant:true});});
window.addEventListener('keydown',e=>{if(/INPUT|BUTTON|A/.test(e.target.tagName)&&e.code!=='Escape')return;if(e.code==='Space'){e.preventDefault();playing?pause():play();}if(e.code==='ArrowRight'){pause();go(index+1);}if(e.code==='ArrowLeft'){pause();go(index-1);}if(e.code==='Home'){pause();go(0);}if(e.code==='End'){pause();go(E.length-1);}});
window.REPLAY={go,pause,play,get state(){return{index,playing,speed,timezone};}};
paint();frame.srcdoc=JSON.parse($('#scene-data').textContent);
})();
</script>
</body>
</html>
